# Settings shared by web, celery_worker, celery_beat and bot.
# .env is written for running Django on your machine (localhost),
# so the hosts below point the containers at the db and redis services instead.
x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    CACHE_REDIS_URL: redis://redis:6379/1
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # All $value come from .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  celery_worker:
    <<: *app
    command: celery -A core worker -l info

  celery_beat:
    <<: *app
    # Keep the schedule file out of the mounted project folder
    command: celery -A core beat -l info -s /tmp/celerybeat-schedule

  # Telegram bot that replies to /start with the chat_id (for TELEGRAM_CHAT_ID).
  # Off by default: only one process may poll a bot token at a time.
  # Start it with: docker compose --profile bot up
  bot:
    <<: *app
    command: python manage.py run_bot
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["bot"]

volumes:
  postgres_data:
  redis_data:
